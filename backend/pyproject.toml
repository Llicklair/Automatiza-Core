[tool.poetry]
name = "automatizacion-backend"
version = "0.1.0"
description = "SaaS de automatización administrativa multiagente para PYMEs"
authors = ["Marcos Recio <marcosreciosanchez@gmail.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = { extras = ["email"], version = "^2.9.0" }
pydantic-settings = "^2.6.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
alembic = "1.13.3"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
PyJWT = "^2.9.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-multipart = "^0.0.12"
apscheduler = "^3.10.0"
httpx = "^0.28.0"
langgraph = "^0.2.0"
langchain-core = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-anthropic = "^0.3.0"
langchain-groq = "^0.2.0"
langchain-huggingface = "^0.1.0"
sentence-transformers = "^3.0.0"
cryptography = "^43.0.0"
pypdf = "^5.0.0"
pgvector = "^0.3.6"
reportlab = "^4.2.0"
# Renderer PDF basado en HTML+CSS para informes textuales (whitepapers, estudios).
# Pipeline: markdown → markdown-it-py → HTML → xhtml2pdf → PDF.
xhtml2pdf = "^0.2.17"
markdown-it-py = "^4.0"
pandas = "^2.2.0"
openpyxl = "^3.1.0"
slowapi = "^0.1.9"
croniter = ">=2,<7"
docxtpl = "^0.16.0"
mammoth = "^1.6.0"
htmldocx = "^0.0.6"
python-docx = "^1.1.0"
celery = { extras = ["redis"], version = ">=5.3,<6" }
redis = { extras = ["hiredis"], version = ">=5.0,<7" }
# Observabilidad LLM opcional: si las keys LANGFUSE_* no están en .env,
# el integrador degrada silenciosamente y no se envía ninguna traza.
langfuse = { version = ">=2.50,<3", optional = true }

[tool.poetry.extras]
observability = ["langfuse"]


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = ">=6,<8"
httpx = "^0.28.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
aiosqlite = "^0.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S110", "S112"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = false
warn_unreachable = false
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["app.agents.*", "tests.*"]
disallow_untyped_defs = false

# SQLAlchemy Column[X] vs X false positives — pervasive in this codebase
[[tool.mypy.overrides]]
module = [
    "app.services.*",
    "app.api.*",
    "app.agents.*",
    "app.workers.*",
    "app.core.*",
    "app.integrations.*",
    "app.middleware.*",
    "app.db.*",
]
disable_error_code = [
    "assignment", "arg-type", "return-value", "union-attr",
    "attr-defined", "misc", "index", "operator", "override",
    "var-annotated", "list-item", "call-overload", "typeddict-unknown-key",
    "call-arg", "unreachable",
]

[[tool.mypy.overrides]]
module = [
    "langgraph.*", "langchain.*", "langchain_core.*", "langchain_openai.*",
    "langchain_anthropic.*", "langchain_groq.*", "langchain_huggingface.*",
    "sentence_transformers.*", "pgvector.*", "reportlab.*", "pypdf.*",
    "apscheduler.*", "slowapi.*", "croniter.*", "docxtpl.*", "mammoth.*",
    "htmldocx.*", "docx.*", "openpyxl.*", "tabula.*",
    # Anadidos 2026-05-16 tras auditoria global (P3 #18):
    "pandas", "pandas.*",
    "lxml", "lxml.*",
    "jose", "jose.*",
    "redis", "redis.*", "redis.asyncio",
    "celery", "celery.*",
    "langfuse", "langfuse.*",
    "prometheus_client", "prometheus_client.*",
    "xhtml2pdf", "xhtml2pdf.*",
    "opendataloader_pdf", "opendataloader_pdf.*",
]
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    "app/agents/*",
    "app/agents/**/*",
    "app/services/email/*",
    "app/services/rag/*",
    "app/services/pdf/*",
    "app/services/excel/*",
    "app/services/ai/provisioning*",
    "app/services/ai/generative_ui*",
    "app/services/workflow/langgraph*",
    "app/workers/*",
    "app/integrations/*",
    "app/services/event_bus.py",
    "app/services/idempotency.py",
    "app/services/execution_context.py",
    "app/services/llm_cache.py",
    "app/services/scheduler.py",
    "app/middleware/rate_limit.py",
    "app/services/assets/*",
    "app/api/ws/*",
    "app/services/workflow/*",
    "app/services/compliance/*",
    "app/services/banking/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Por defecto excluimos los tests `e2e` (LLM real vía Claude CLI — no
# deterministas: dependen de qué tool elige el modelo) y los `slow`
# (migraciones). Así el run por defecto y CI son estables y rápidos.
# Para ejecutarlos a propósito: `pytest -m e2e` o `pytest -m slow`
# (el -m de la línea de comandos sobreescribe este addopts).
addopts = "-m 'not e2e and not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: end-to-end tests requiring Claude CLI (deselect with '-m \"not e2e\"')",
]

name: Release — AutomatizaCore

on:
  push:
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  test:
    name: Full Test Suite
    uses: ./.github/workflows/ci.yml

  build-electron:
    name: Build Electron App
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-build
          # latest.yml y .blockmap son OBLIGATORIOS para electron-updater:
          # sin ellos los clientes nunca detectan la actualización.
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-electron
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: electron-build
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # Los clientes actualizan desde el repo PÚBLICO de releases (el código
          # sigue privado). electron-updater lee latest.yml de aquí.
          repository: Llicklair/automatizacore-releases
          generate_release_notes: true
          files: dist/*
        env:
          # GITHUB_TOKEN no puede escribir en otro repo: RELEASES_TOKEN es un
          # secret del repo fuente con permiso de contents:write sobre
          # automatizacore-releases (recomendado: PAT fine-grained).
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}

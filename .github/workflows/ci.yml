name: CI — AutomatizaCore

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  # Permite que release.yml (uses: ./.github/workflows/ci.yml) reutilice este
  # workflow como "Full Test Suite" en el flujo de release (tags v*). Sin esta
  # clave GitHub falla: "workflow_call key is not defined in the referenced workflow".
  workflow_call:

env:
  # QA.CI — Python exact match con el binario embebido en el instalador
  # (`dependencies/embedded_binaries.json`). Bumpear ambos a la vez.
  PYTHON_VERSION: "3.11.9"
  NODE_VERSION: "20"

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      # pycairo compila contra la lib de sistema Cairo (PEP 517 sdist). Sin estos
      # paquetes el build aborta con "Dependency cairo not found".
      - name: Install system deps (Cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Poetry 2.x: el poetry.lock commiteado es lock-version 2.1 (generado por
      # Poetry 2.3.4) — Poetry 1.8.2 NO puede leerlo y aborta. El plugin export
      # se usa en el drift-guard de requirements.txt más abajo.
      - name: Install Poetry
        run: pip install poetry==2.3.4 poetry-plugin-export

      - name: Cache Poetry deps
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      # QA.CI — requirements.txt es un ARTEFACTO GENERADO desde poetry.lock (es
      # lo que el instalador de escritorio pip-instala en cada máquina). Este
      # guard falla si alguien lo editó a mano o cambió deps sin regenerarlo,
      # impidiendo que el árbol del cliente vuelva a divergir del que testea CI.
      # Se comparan solo las líneas de dependencia (se ignoran comentarios/blancos).
      - name: Verify requirements.txt sync (no drift)
        run: |
          poetry export --only main --without-hashes -o /tmp/req.expected.txt
          if ! diff <(grep -vE '^[[:space:]]*#' requirements.txt | sed '/^[[:space:]]*$/d' | sort) \
                    <(grep -vE '^[[:space:]]*#' /tmp/req.expected.txt | sed '/^[[:space:]]*$/d' | sort); then
            echo "::error::backend/requirements.txt está desincronizado con poetry.lock. Regenéralo: poetry -C backend export --only main --without-hashes -o requirements.txt"
            exit 1
          fi

      - name: Ruff lint
        run: poetry run ruff check app/ --select E,W,F,I --ignore E501,E402,E701,E702,E731,W293

      # ADVISORY (continue-on-error) mientras se rampea: `ruff format` nunca se
      # aplicó al repo entero (~350 ficheros divergen del estilo). Reformatear de
      # golpe destrozaría git blame; se hará por tandas y se sube a bloqueante
      # luego. Aplicar con `poetry run ruff format app/`. El error-catching real
      # (Ruff lint, arriba) SÍ es bloqueante.
      - name: Ruff format check
        run: poetry run ruff format app/ --check
        continue-on-error: true

      # QA.CI — mypy estricto solo en agents/ y services/ (consenso Ronda 32:
      # las rutas API y migrations toleran tipos laxos por ahora).
      # ADVISORY (continue-on-error) mientras se rampea el tipado: hoy hay ~1500
      # gaps de tipo en agents/services y el pyproject ya relaja tipos a propósito
      # (disallow_untyped_defs=false + disable_error_code por los false-positives de
      # SQLAlchemy Column[X]). El flag --strict los re-activa todos. Se mantiene
      # como señal visible sin bloquear; subir a bloqueante cuando los gaps bajen.
      - name: Mypy strict en agents y services
        run: poetry run mypy app/agents app/services --strict --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Mypy resto del backend (no-bloqueante)
        run: poetry run mypy app/ --ignore-missing-imports
        continue-on-error: true

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: automatizacore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install system deps (Cairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==2.3.4

      - name: Install dependencies
        run: poetry install --no-interaction

      # Init del schema vía create_all + stamp head (ruta "fresh" del desktop),
      # NO `alembic upgrade head`: la cadena de migraciones no es self-consistent
      # desde una BD vacía (tablas que solo viven en modelos, p.ej. work_schedules;
      # revision ids >32 chars). Ver backend/scripts/ci_init_db.py.
      - name: Init DB schema (create_all + stamp)
        timeout-minutes: 3
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/automatizacore_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          TENANT_ENCRYPTION_KEY: ci-test-encryption-key-1234567890abc
          OPENAI_API_KEY: sk-test-fake-key
        run: poetry run python scripts/ci_init_db.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/automatizacore_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          TENANT_ENCRYPTION_KEY: ci-test-encryption-key-1234567890abc
          OPENAI_API_KEY: sk-test-fake-key
        # QA.COV — gate en modo "ratchet": fijado al suelo real actual (~58%)
        # para impedir REGRESIONES sin bloquear CI. Subir por escalones a medida
        # que se añaden tests (objetivo a medio plazo: 70%).
        run: poetry run pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-fail-under=57

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        # Flat config (eslint.config.mjs): el flag --ext se eliminó en ESLint v9+;
        # los tipos de archivo a lintar los define el propio config.
        run: npx eslint src/ --max-warnings 20

  frontend-test:
    name: Frontend — Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: frontend/coverage/coverage-final.json
          flags: frontend
        continue-on-error: true

  frontend-a11y:
    name: Frontend — Accessibility (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run axe-core a11y suite
        run: npm run test:a11y

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test, frontend-a11y]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

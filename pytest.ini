[pytest]
# Hacer que `pytest` desde la raíz del repo solo recoja la suite real,
# evitando que importe scripts CLI como `backend/scripts/test_*.py`
# (argparsean al cargarse) o utilidades sueltas como `backend/test_tasks.py`.
testpaths = backend/tests
asyncio_mode = auto
norecursedirs =
    backend/scripts
    backend/__pycache__
    backend/.venv
    node_modules
    .next
    .venv
    venv
    __pycache__
    desktop
    frontend
    tasks
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: end-to-end tests requiring Claude CLI (deselect with '-m "not e2e"')
